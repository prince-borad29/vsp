server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true # Crucial: Handles OPTIONS preflight requests globally
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600

          routes:
            - id: auth-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/auth/**

            - id: content-service-admin
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/movies/**
                - Method=POST,PUT,DELETE
              filters:
                - AuthenticationFilter=ROLE_ADMIN

            - id: content-service-read
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/movies/**
                - Method=GET
              filters:
                - AuthenticationFilter

            - id: video-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/videos/**
              filters:
                - AuthenticationFilter=ROLE_ADMIN

            - id: streaming-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/stream/**

jwt:
  secret: ${JWT_SECRET}