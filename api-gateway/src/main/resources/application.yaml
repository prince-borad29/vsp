server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/\*\*]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        - id: auth-service-public
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/auth/**

        - id: auth-service-protected
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/user/**
          filters:
            - AuthenticationFilter

        - id: content-service-admin
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/movies/**
            - Method=POST,PUT,DELETE,PATCH
          filters:
            - name: AuthenticationFilter
              args:
                requiredRole: ROLE_ADMIN

        - id: content-service-read
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/movies/**
            - Method=GET
          filters:
            - AuthenticationFilter

        - id: video-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/videos/**
          filters:
            - name: AuthenticationFilter
              args:
                requiredRole: ROLE_ADMIN

        - id: streaming-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/stream/**

        - id: review-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/review/**
            - Method=POST,GET

        - id: review-service-delete
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/review/**
            - Method=DELETE
          filters:
            - name: AuthenticationFilter
              args:
                requiredRole: ROLE_ADMIN

jwt:
  secret: ${JWT_SECRET}
